name: dbt_airbnb_pipeline
version: '1.0.0'
profile: dbt-airbnb-pipeline

model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]
analysis-paths: [analysis]
macro-paths: [macros]
snapshot-paths: [snapshots]
docs-paths: [docs]

# .nosync suffix keeps iCloud Drive from syncing installed packages
# (it creates "file 2.sql" conflict copies that break dbt parsing)
packages-install-path: dbt_packages.nosync

clean-targets:
    - target
    - dbt_packages.nosync
    - logs

on-run-start:
  - "{{ create_target_database() }}"

models:
  dbt_airbnb_pipeline:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
