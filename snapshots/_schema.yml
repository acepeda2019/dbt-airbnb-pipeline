snapshots:
  - name: src_bookings_snapshot
    relation: source('raw','bookings') 
    description: Track historical changes to bookings source
    config:
      strategy: timestamp
      unique_key: booking_id
      updated_at: created_at
  - name: src_hosts_snapshot
    relation: source('raw','hosts') 
    description: Track historical changes to host source
    config:
      strategy: timestamp
      unique_key: host_id
      updated_at: created_at
  - name: src_listings_snapshot
    relation: source('raw','listings') 
    description: Track historical changes to listings source
    config:
      strategy: timestamp
      unique_key: listing_id
      updated_at: created_at