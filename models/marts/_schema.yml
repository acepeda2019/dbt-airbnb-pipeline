models:
  - name: fct_bookings
    description: >
      One row per booking, with the listing and host attached. Carries both the
      current price, superhost status and response rate and their values as of
      the booking date, looked up in the change-history models.
    data_tests:
        - dbt_utils.equal_rowcount:
            arguments:
                compare_model: ref('int_bookings')
    columns:
      - name: booking_id
        data_type: varchar
        description: "{{ doc('booking_id') }}"
        data_tests:
            - unique
            - not_null

      - name: listing_id
        data_type: number
        description: "{{ doc('listing_id') }}"

      - name: host_id
        data_type: number
        description: "{{ doc('host_id') }} Host of the listing, based on the current listing-to-host mapping."

      - name: property_type
        data_type: varchar
        description: "{{ doc('property_type') }}"

      - name: room_type
        data_type: varchar
        description: "{{ doc('room_type') }}"

      - name: city
        data_type: varchar
        description: "{{ doc('city') }}"

      - name: country
        data_type: varchar
        description: "{{ doc('country') }}"

      - name: accommodates
        data_type: number
        description: "{{ doc('accommodates') }}"

      - name: bedrooms
        data_type: number
        description: "{{ doc('bedrooms') }}"

      - name: bathrooms
        data_type: number
        description: "{{ doc('bathrooms') }}"

      - name: host_name
        data_type: varchar
        description: "{{ doc('host_name') }}"

      - name: host_since
        data_type: date
        description: "{{ doc('host_since') }}"

      - name: is_seasoned_host
        data_type: boolean
        description: "{{ doc('is_seasoned_host') }}"

      - name: current_is_superhost
        data_type: boolean
        description: "{{ doc('is_superhost') }} Current value, which may differ from the value when the booking was made."

      - name: current_response_rate
        data_type: number
        description: "{{ doc('response_rate') }} Current value, which may differ from the value when the booking was made."

      - name: current_price_per_night
        data_type: number
        description: "{{ doc('price_per_night') }} Current value, which may differ from the value when the booking was made."

      - name: booking_is_superhost
        data_type: boolean
        description: "{{ doc('is_superhost') }} As of the booking date. Uses the earliest known value when the booking predates the recorded history."

      - name: booking_response_rate
        data_type: number
        description: "{{ doc('response_rate') }} As of the booking date. Uses the earliest known value when the booking predates the recorded history."

      - name: booking_price_per_night
        data_type: number
        description: "{{ doc('price_per_night') }} As of the booking date. Uses the earliest known value when the booking predates the recorded history."

      - name: is_price_backfilled
        data_type: boolean
        description: "Price {{ doc('is_backfilled_flag') }}"

      - name: is_superhost_backfilled
        data_type: boolean
        description: "Superhost {{ doc('is_backfilled_flag') }}"

      - name: is_response_rate_backfilled
        data_type: boolean
        description: "Response Rate {{ doc('is_backfilled_flag') }}"

      - name: booking_status_change_ct
        data_type: number
        description: Number of times the booking's status has changed since it was first recorded, 0 if it never changed

      - name: booking_status
        data_type: varchar
        description: "{{ doc('booking_status') }} Current value."

      - name: booking_date
        data_type: timestamp_ntz
        description: "{{ doc('booking_date') }}"

      - name: nights_booked
        data_type: number
        description: "{{ doc('nights_booked') }}"

      - name: booking_amount
        data_type: number
        description: "{{ doc('booking_amount') }}"

      - name: cleaning_fee
        data_type: number
        description: "{{ doc('cleaning_fee') }}"

      - name: service_fee
        data_type: number
        description: "{{ doc('service_fee') }}"

      - name: total_fees
        data_type: number
        description: "{{ doc('total_fees') }}"

      - name: total_revenue
        data_type: number
        description: "{{ doc('total_revenue') }}"